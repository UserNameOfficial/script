name: Ragim Panel Discord release

on:
  push:
    branches: [main]
    paths: [script.lua]
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify access without sending Discord messages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ragim-discord-release
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify published script and notify Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            python3 notify_discord.py --commit "$GITHUB_SHA" --from-commit --check
          else
            python3 notify_discord.py --commit "$GITHUB_SHA" --from-commit
          fi

